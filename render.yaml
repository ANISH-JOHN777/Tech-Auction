services:
  - type: web
    name: tech-auction-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w apps/server
    envVars:
      - key: PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_ASSIST_DURATION_SECONDS
        value: 900
      - key: AI_MAX_REQUESTS
        value: 30
